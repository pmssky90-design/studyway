<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyWay 검색 썸네일 검사기</title><style>
:root{--ink:#17211d;--muted:#64716b;--line:#dce5df;--soft:#edf5f0;--accent:#176b4d;--bad:#a52a2a}*{box-sizing:border-box}body{margin:0;background:#f7f9f6;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}header{padding:28px max(20px,calc((100% - 1180px)/2));background:#fff;border-bottom:1px solid var(--line)}h1{margin:0 0 8px;font-size:clamp(1.65rem,4vw,2.5rem)}main{width:min(1180px,calc(100% - 32px));margin:24px auto 70px}.stats,.toolbar,.thumbs,.results{display:grid;gap:12px}.stats{grid-template-columns:repeat(4,1fr)}.stat,.panel,.card,.thumb{background:#fff;border:1px solid var(--line);border-radius:14px}.stat{padding:16px}.stat b{display:block;font-size:1.55rem}.panel{padding:18px;margin-top:18px}.toolbar{grid-template-columns:1fr auto auto}input,select,button{font:inherit;padding:11px 13px;border:1px solid #cdd8d1;border-radius:10px;background:#fff}button{cursor:pointer;font-weight:700;color:var(--accent)}.thumbs{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.thumb{padding:10px;cursor:pointer}.thumb img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px}.thumb.active{outline:3px solid #45a47d}.results{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:16px}.card-head{display:flex;justify-content:space-between;gap:10px}.badge{font-size:.78rem;border-radius:999px;padding:3px 8px;background:var(--soft)}.bad{color:var(--bad)}.preview{margin:12px 0;border:1px solid #ccd5cf;border-radius:13px;overflow:hidden;background:white}.preview img{width:100%;display:block;aspect-ratio:1.91/1;object-fit:cover}.preview-copy{padding:12px}.preview-copy b{display:block}.preview-copy small{color:var(--muted)}dl{display:grid;grid-template-columns:110px 1fr;gap:6px;margin:12px 0;font-size:.88rem}dt{font-weight:700}dd{margin:0;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions a{padding:8px 10px;background:var(--soft);border-radius:8px;color:var(--accent)}.source{font-family:ui-monospace,monospace;font-size:.77rem}.hidden{display:none}.note{color:var(--muted);font-size:.9rem}@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr}.results{grid-template-columns:1fr}main{width:min(100% - 20px,1180px)}}
</style></head><body><header><h1>StudyWay 검색 썸네일 검사기</h1><p class="note">로컬 읽기 전용 도구입니다. 검색 서비스의 실제 썸네일 채택을 확정하지 않습니다.</p></header><main>
<section class="stats" id="stats"></section>
<section class="panel"><div class="toolbar"><input id="query" placeholder="지역명, 학교명, title, URL 검색"><select id="type"><option value="">전체 유형</option></select><button id="random">무작위 페이지 20개 보기</button></div><p class="note" id="count"></p></section>
<section class="panel"><h2>썸네일 13개</h2><div class="thumbs" id="thumbs"></div></section>
<section class="panel"><h2>페이지별 미리보기</h2><div class="results" id="results"></div></section>
</main><script>
let DATA,filtered=[],thumbFilter='';const $=s=>document.querySelector(s);const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function stats(){const a=DATA.audit;$('#stats').innerHTML=[['전체 콘텐츠',a.total],['썸네일',a.thumbnail_count],['og:image 정상',a.normal],['오류',a.errors]].map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1].toLocaleString()}</b></div>`).join('')}
function thumbs(){$('#thumbs').innerHTML=DATA.thumbnails.map(t=>`<div class="thumb ${thumbFilter===t.name?'active':''}" data-thumb="${t.name}"><img src="assets/${t.name}" alt="${t.name}"><b>${t.name}</b><div>${t.width}×${t.height}</div><small>사용 페이지: ${t.usage.toLocaleString()}</small></div>`).join('');document.querySelectorAll('.thumb').forEach(x=>x.onclick=()=>{thumbFilter=thumbFilter===x.dataset.thumb?'':x.dataset.thumb;filter();thumbs()})}
function card(r){return `<article class="card"><div class="card-head"><h3>${esc(r.h1)}</h3><span class="badge ${r.status==='PASS'?'':'bad'}">${r.status}</span></div><div class="preview"><img src="assets/${r.thumbnail}" alt=""><div class="preview-copy"><b>${esc(r.title)}</b><small>StudyWay · studyway.kr</small></div></div><dl><dt>페이지 URL</dt><dd>${esc(r.url)}</dd><dt>og:image</dt><dd>${esc(r.ogImage)}</dd><dt>Thumbnail</dt><dd>${r.thumbnail}</dd><dt>Image</dt><dd>1254 × 1254</dd><dt>유형</dt><dd>${r.province} · ${r.kind==='region'?'지역':'학교'} · ${r.type}</dd></dl><details><summary>HTML SOURCE 확인</summary><dl class="source"><dt>TITLE</dt><dd>${esc(r.title)}</dd><dt>CANONICAL</dt><dd>${esc(r.canonical)}</dd><dt>OG TITLE</dt><dd>${esc(r.ogTitle||'(없음)')}</dd><dt>OG IMAGE</dt><dd>${esc(r.ogImage)}</dd><dt>TWITTER</dt><dd>${esc(r.twitterImage)}</dd></dl></details><div class="actions"><a target="_blank" href="${DATA.localSite+r.url}">페이지 열기</a><a target="_blank" href="assets/${r.thumbnail}">썸네일 직접 열기</a></div></article>`}
function render(list){filtered=list;$('#count').textContent=`검색 결과 ${list.length.toLocaleString()}개 · 화면에는 최대 100개 표시`;$('#results').innerHTML=list.slice(0,100).map(card).join('')||'<p>결과가 없습니다.</p>'}
function filter(){const q=$('#query').value.trim().toLowerCase(),type=$('#type').value;render(DATA.records.filter(r=>(!q||[r.h1,r.title,r.url].join(' ').toLowerCase().includes(q))&&(!type||`${r.kind}|${r.type}`===type)&&(!thumbFilter||r.thumbnail===thumbFilter)))}
fetch('data.json').then(r=>r.json()).then(d=>{DATA=d;stats();thumbs();const types=[...new Set(d.records.map(r=>`${r.kind}|${r.type}`))].sort();$('#type').innerHTML+=types.map(x=>{const[k,t]=x.split('|');return `<option value="${x}">${k==='region'?'지역':'학교'} · ${t}</option>`}).join('');filter();$('#query').oninput=filter;$('#type').onchange=filter}).catch(e=>document.body.innerHTML+=`<pre>${e}</pre>`);
$('#random').onclick=()=>{const a=[...DATA.records];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}render(a.slice(0,20))};
</script></body></html>
